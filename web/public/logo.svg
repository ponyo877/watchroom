<svg viewBox="0 0 240 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="playGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#A855F7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Speech bubble icon (same design as favicon.svg, scaled 1.5x) -->
  <g filter="url(#dropShadow)" transform="translate(2, 4)">
    <!-- Rounded rectangle speech bubble -->
    <rect x="3" y="3" width="42" height="33" rx="7.5" ry="7.5"
          fill="none" stroke="url(#logoGradient)" stroke-width="3"/>
    <!-- Speech bubble tail -->
    <path d="M12,36 L12,45 L21,36" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Play button triangle - centered in bubble -->
    <path d="M16.5,12 L34.5,19.5 L16.5,27 Z" fill="url(#playGradient)"/>
  </g>

  <!-- Text: WatchRoom -->
  <text x="58" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="-0.5">
    <tspan fill="#3B82F6">Watch</tspan><tspan fill="#A855F7">Room</tspan>
  </text>
</svg>
