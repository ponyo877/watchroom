<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="40%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="playFillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Rounded rectangle speech bubble -->
  <rect x="2" y="2" width="28" height="22" rx="5" ry="5"
        fill="none" stroke="url(#faviconGradient)" stroke-width="2"/>

  <!-- Speech bubble tail -->
  <path d="M8,24 L8,30 L14,24" fill="none" stroke="url(#faviconGradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Play button triangle - centered in bubble -->
  <path d="M11,8 L23,13 L11,18 Z" fill="url(#playFillGradient)"/>
</svg>
