<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WatchRoom" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@900&display=swap" rel="stylesheet">
    <title>WatchRoom - YouTube同時視聴</title>

    <!-- Critical CSS for initial loading UI (prevents NO_FCP) -->
    <style>
      .initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #fafafa;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .initial-loader svg {
        width: 48px;
        height: 48px;
        animation: initial-spin 1s linear infinite;
      }
      .initial-loader p {
        margin-top: 16px;
        color: #666;
        font-size: 14px;
      }
      @keyframes initial-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @media (prefers-color-scheme: dark) {
        .initial-loader { background: #0a0a0a; }
        .initial-loader p { color: #999; }
      }
    </style>

    <!-- OGP Meta Tags -->
    <meta property="og:title" content="WatchRoom - YouTube同時視聴" />
    <meta property="og:description" content="友達と一緒にYouTube動画を同時視聴できるサービス" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://watchroom.ponyo877.com/" />
    <meta property="og:image" content="https://watchroom.ponyo877.com/ogp.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="WatchRoom" />
    <meta property="og:locale" content="ja_JP" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WatchRoom - YouTube同時視聴" />
    <meta name="twitter:description" content="友達と一緒にYouTube動画を同時視聴できるサービス" />
    <meta name="twitter:image" content="https://watchroom.ponyo877.com/ogp.png" />
  </head>
  <body>
    <div id="root">
      <!-- Initial loading UI - replaced by React on hydration -->
      <div class="initial-loader">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" stroke="#8b5cf6"/>
        </svg>
        <p>読み込み中...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
