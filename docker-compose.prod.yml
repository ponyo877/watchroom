version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: watchroom-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: watchroom
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - watchroom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: .
      dockerfile: docker/production/api-server.Dockerfile
    container_name: watchroom-api-prod
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/watchroom
      - SKYWAY_APP_ID=${SKYWAY_APP_ID}
      - SKYWAY_SECRET_KEY=${SKYWAY_SECRET_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - watchroom-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/production/web.Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SKYWAY_APP_ID=${VITE_SKYWAY_APP_ID}
    container_name: watchroom-web-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server
    networks:
      - watchroom-network
    restart: unless-stopped

volumes:
  mysql-data:

networks:
  watchroom-network:
    driver: bridge
