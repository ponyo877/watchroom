version: '3'

vars:
  TYPESPEC_DIR: ./typespec
  WEB_DIR: ./web
  DB_DIR: ./db

tasks:
  # Code Generation
  tsp:
    desc: TypeSpecをコンパイル
    dir: "{{.TYPESPEC_DIR}}"
    cmds:
      - pnpm install
      - pnpm run compile

  ogen:
    desc: ogenでGoサーバーコードを生成
    deps: [tsp]
    cmds:
      - go generate ./cmd/api-server/main.go

  sqlc:
    desc: sqlcでGoデータベースコードを生成
    dir: "{{.DB_DIR}}"
    cmds:
      - sqlc generate

  openapi-client:
    desc: orvalでTypeScriptクライアントを生成
    dir: "{{.WEB_DIR}}"
    deps: [tsp]
    cmds:
      - pnpm install
      - pnpm run generate-client

  msw:
    desc: MSW Service Workerを生成
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm msw init public --save

  generate:
    desc: すべてのコード生成を実行
    deps: [tsp]
    cmds:
      - task: ogen
      - task: sqlc
      - task: openapi-client

  # Development
  dev:
    desc: 開発環境を起動
    cmds:
      - docker compose up -d
      - docker compose logs -f

  dev:build:
    desc: 開発環境をビルドして起動
    cmds:
      - docker compose up -d --build
      - docker compose logs -f

  dev:msw:
    desc: MSWモック有効でフロントエンドを起動
    dir: "{{.WEB_DIR}}"
    env:
      VITE_ENABLE_MSW: "true"
    cmds:
      - pnpm dev

  # Infrastructure
  up:
    desc: Docker Composeで起動
    cmds:
      - docker compose up -d

  down:
    desc: Docker Composeで停止
    cmds:
      - docker compose down

  reset:
    desc: Docker Composeをリセット
    cmds:
      - docker compose down -v
      - docker compose up -d --build

  logs:
    desc: ログを表示
    cmds:
      - docker compose logs -f --tail=100

  logs:api:
    desc: APIサーバーのログを表示
    cmds:
      - docker compose logs -f api-server

  logs:web:
    desc: Webサーバーのログを表示
    cmds:
      - docker compose logs -f web

  # Database
  db:shell:
    desc: MySQLシェルに接続
    cmds:
      - docker compose exec mysql mysql -uwatchroom -pwatchroom watchroom

  db:reset:
    desc: データベースをリセット
    cmds:
      - docker compose exec -T mysql mysql -uroot -prootpassword -e "DROP DATABASE IF EXISTS watchroom; CREATE DATABASE watchroom;"
      - docker compose exec -T mysql mysql -uwatchroom -pwatchroom watchroom < db/init/schema.sql

  # Code Quality
  fmt:
    desc: Goコードをフォーマット
    cmds:
      - go fmt ./...

  lint:
    desc: Goコードをリント
    cmds:
      - golangci-lint run ./...

  test:
    desc: Goテストを実行
    cmds:
      - go test -v ./...

  test:web:
    desc: フロントエンドテストを実行
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm test

  # Build
  build:
    desc: 本番用ビルド
    cmds:
      - docker compose -f docker-compose.prod.yml build

  # Utilities
  clean:
    desc: 生成ファイルを削除
    cmds:
      - rm -rf ./cmd/api-server/openapi
      - rm -rf ./db/generated_sql
      - rm -rf ./typespec/tsp-output
      - rm -rf ./web/src/generated-client

  install:tools:
    desc: 開発ツールをインストール
    cmds:
      - go install github.com/air-verse/air@latest
      - go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - go install github.com/ogen-go/ogen/cmd/ogen@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

  # Setup
  setup:
    desc: 初回セットアップ
    cmds:
      - cp -n .env.example .env || true
      - task: install:tools
      - cd {{.TYPESPEC_DIR}} && pnpm install
      - cd {{.WEB_DIR}} && pnpm install
