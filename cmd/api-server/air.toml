root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/api-server"
  cmd = "go build -o ./tmp/api-server ./cmd/api-server"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "web", "node_modules", "typespec", "docker", ".git"]
  exclude_file = []
  exclude_regex = ["_test\\.go$", "_gen\\.go$"]
  exclude_unchanged = true
  follow_symlink = false
  full_bin = ""
  include_dir = ["cmd", "internal", "db"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
